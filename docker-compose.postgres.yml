services:
  postgres:
    image: postgres:16-alpine
    container_name: hjhllm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hjhllm
      POSTGRES_USER: hjhllm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hjhllm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hjhllm -d hjhllm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hjhllm-postgres-data:
