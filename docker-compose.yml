services:
  postgres:
    image: postgres:16-alpine
    container_name: hjhllm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hjhllm
      POSTGRES_USER: hjhllm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hjhllm -d hjhllm"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hjhllm-backend
    restart: unless-stopped
    environment:
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?ADMIN_API_TOKEN is required}
      DATABASE_URL: postgres://hjhllm:${POSTGRES_PASSWORD}@postgres:5432/hjhllm
      ATTACHMENT_STORAGE_DIR: /data/attachments
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - attachments:/data/attachments
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: hjhllm-frontend
    restart: unless-stopped
    environment:
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?ADMIN_API_TOKEN is required}
      BACKEND_API_BASE_URL: http://backend:8000
      ENABLE_ADMIN_UI: ${ENABLE_ADMIN_UI:-false}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_BIND:-0.0.0.0:80}:3000"

volumes:
  postgres-data:
  attachments:
